<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rascunhos LeBillet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b1f2a; --muted:#5b6374; --line:#dde1e9;
  --accent:#2447d8; --accent-ink:#ffffff; --field:#f8f9fb;
  --note-bg:#fdf0dc; --note-ink:#7a4a0c; --note-line:#e8c48a;
  --sent:#23884f; --sent-bg:#e3f1e8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#12141b;--surface:#1b1e27;--ink:#e8eaf0;--muted:#9aa1b2;--line:#2c303c;
  --accent:#7d95ff;--accent-ink:#0d1020;--field:#151821;
  --note-bg:#3a2b14;--note-ink:#f0c27a;--note-line:#6b4d1d;--sent:#8fd6a8;--sent-bg:#1c3326;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#12141b;--surface:#1b1e27;--ink:#e8eaf0;--muted:#9aa1b2;--line:#2c303c;
  --accent:#7d95ff;--accent-ink:#0d1020;--field:#151821;
  --note-bg:#3a2b14;--note-ink:#f0c27a;--note-line:#6b4d1d;--sent:#8fd6a8;--sent-bg:#1c3326;}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1}
.lede{color:var(--muted);margin:6px 0 0;max-width:70ch}
.num{font-family:var(--mono);font-size:.9em;font-variant-numeric:tabular-nums}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .num{margin-left:4px}
input[type=search]{flex:1 1 200px;min-width:0;font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
label.tog{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.count{margin-left:auto;font-size:14px;color:var(--muted)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
.head h2{font-size:17px;flex:1 1 320px;font-family:var(--body);font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--field);color:var(--muted);border:1px solid var(--line)}
.tag.sent{background:var(--sent-bg);color:var(--sent);border-color:transparent}
.cols{display:grid;grid-template-columns:1fr 1fr}
.col{padding:14px 16px;min-width:0;display:grid;gap:10px;align-content:start}
.col+.col{border-left:1px solid var(--line)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:15px/1.55 var(--body)}
.from{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.note{background:var(--note-bg);color:var(--note-ink);border:1px solid var(--note-line);border-radius:8px;padding:8px 10px;font-size:14px}
.note b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
details .text{font-size:13px;color:var(--muted);margin-top:6px;max-height:320px;overflow:auto}
.copy{justify-self:start;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--accent);background:none;color:var(--accent);padding:4px 10px;border-radius:7px;cursor:pointer}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rascunhos de resposta</h1>
    <p class="lede">Cada email recebido ao lado da resposta que o sistema escreveu em Rascunhos. O que tiver nota interna precisa de uma ação antes de enviar. Gerado a {{STAMP}}; os dados ficam só neste Mac.</p>
  </header>
  <div class="toolbar" role="group" aria-label="Filtros">
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <input type="search" id="q" placeholder="Procurar no assunto, email ou rascunho" aria-label="Procurar">
    <label class="tog"><input type="checkbox" id="onlyNote"> Só com nota interna</label>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <main id="list" style="display:grid;gap:14px"></main>
</div>
<script id="data" type="application/json">{{DATA}}</script>
<script>
const items=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==="class")e.className=v;else if(n==="text")e.textContent=v;else if(n.startsWith("on"))e.addEventListener(n.slice(2),v);else e.setAttribute(n,v)}e.append(...k);return e};
const state={folder:"todas",q:"",note:false};
try{const p=JSON.parse(localStorage.getItem("lb-rasc")||"{}");Object.assign(state,p)}catch{}
const save=()=>{try{localStorage.setItem("lb-rasc",JSON.stringify({folder:state.folder,note:state.note}))}catch{}};

function copy(t,btn){
  const done=()=>{btn.textContent="Copiado";setTimeout(()=>btn.textContent="Copiar rascunho",1600)};
  navigator.clipboard.writeText(t).then(done).catch(()=>{const s=window.getSelection(),r=document.createRange();r.selectNodeContents(btn.previousElementSibling);s.removeAllRanges();s.addRange(r);btn.textContent="Texto selecionado"});
}
function card(it){
  const tags=[el("span",{class:"tag",text:it.folder})];
  if(it.sent)tags.push(el("span",{class:"tag sent",text:it.kept==null?"Respondido":`Enviado · ${Math.round(it.kept*100)} % mantido`}));
  const left=el("div",{class:"col"},el("div",{class:"label",text:"Email recebido"}),
    el("div",{class:"from",text:[it.from,it.date].filter(Boolean).join(" · ")}),
    el("p",{class:"text",text:it.found?(it.text||"(sem texto novo)"):"Email original não encontrado no servidor."}));
  if(it.full&&it.full.trim()!==it.text.trim())left.append(el("details",{},el("summary",{text:"Mensagem completa, com o histórico"}),el("p",{class:"text",text:it.full})));
  const right=el("div",{class:"col"},el("div",{class:"label",text:"Rascunho"}));
  if(it.note)right.append(el("div",{class:"note"},el("b",{text:"Nota interna"}),document.createTextNode(it.note)));
  const body=el("p",{class:"text",text:it.draft});
  right.append(body,el("button",{type:"button",class:"copy",text:"Copiar rascunho",onclick:e=>copy(it.draft,e.currentTarget)}));
  return el("article",{class:"case"},el("div",{class:"head"},el("h2",{text:it.subject}),...tags,el("span",{class:"meta",text:"Rascunho de "+it.created})),el("div",{class:"cols"},left,right));
}
function chips(){
  const by={};items.forEach(i=>by[i.folder]=(by[i.folder]||0)+1);
  const box=$("#chips");box.replaceChildren();
  for(const[f,n]of[["todas",items.length],...Object.entries(by).sort()]){
    box.append(el("button",{type:"button",class:"chip","aria-pressed":String(state.folder===f),onclick:()=>{state.folder=f;save();chips();render()}},f==="todas"?"Todas":f,el("span",{class:"num",text:String(n)})));
  }
}
function render(){
  const q=state.q.toLowerCase();
  const vis=items.filter(i=>(state.folder==="todas"||i.folder===state.folder)&&(!state.note||i.note)&&(!q||[i.subject,i.from,i.text,i.draft,i.note].join(" ").toLowerCase().includes(q)));
  $("#list").replaceChildren(...(vis.length?vis.map(card):[el("div",{class:"empty",text:items.length?"Nenhum rascunho com estes filtros.":"Ainda não há rascunhos."})]));
  $("#count").textContent=`${vis.length} de ${items.length}`;
}
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#onlyNote").checked=!!state.note;
$("#onlyNote").addEventListener("change",e=>{state.note=e.target.checked;save();render()});
chips();render();
</script>
</body>
</html>
